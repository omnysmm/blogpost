<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="800" viewBox="0 0 1920 800">
  <defs>
    <radialGradient id="ag1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="ablur"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="aglow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="aline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="agrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="0.8" fill="rgba(139,92,246,0.08)"/>
    </pattern>
  </defs>
  <rect width="1920" height="800" fill="url(#agrid)"/>
  <ellipse cx="300" cy="250" rx="400" ry="300" fill="url(#ag1)" filter="url(#ablur)"/>
  <ellipse cx="1500" cy="500" rx="350" ry="250" fill="url(#ag2)" filter="url(#ablur)"/>
  <!-- Neural network visualization -->
  <g filter="url(#aglow)" opacity="0.4">
    <!-- Layer 1 -->
    <circle cx="300" cy="200" r="5" fill="#6366f1"/>
    <circle cx="300" cy="350" r="5" fill="#6366f1"/>
    <circle cx="300" cy="500" r="5" fill="#6366f1"/>
    <circle cx="300" cy="650" r="4" fill="#6366f1"/>
    <!-- Layer 2 -->
    <circle cx="700" cy="150" r="4" fill="#8b5cf6"/>
    <circle cx="700" cy="300" r="5" fill="#8b5cf6"/>
    <circle cx="700" cy="450" r="5" fill="#8b5cf6"/>
    <circle cx="700" cy="600" r="4" fill="#8b5cf6"/>
    <!-- Layer 3 -->
    <circle cx="1100" cy="200" r="4" fill="#a78bfa"/>
    <circle cx="1100" cy="400" r="5" fill="#a78bfa"/>
    <circle cx="1100" cy="550" r="4" fill="#a78bfa"/>
    <!-- Layer 4 -->
    <circle cx="1500" cy="300" r="5" fill="#06b6d4"/>
    <circle cx="1500" cy="450" r="5" fill="#06b6d4"/>
    <!-- Connections L1-L2 -->
    <line x1="300" y1="200" x2="700" y2="150" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
    <line x1="300" y1="200" x2="700" y2="300" stroke="#6366f1" stroke-width="0.5" opacity="0.2"/>
    <line x1="300" y1="350" x2="700" y2="300" stroke="#6366f1" stroke-width="0.6" opacity="0.3"/>
    <line x1="300" y1="350" x2="700" y2="450" stroke="#6366f1" stroke-width="0.5" opacity="0.2"/>
    <line x1="300" y1="500" x2="700" y2="450" stroke="#6366f1" stroke-width="0.6" opacity="0.3"/>
    <line x1="300" y1="500" x2="700" y2="600" stroke="#6366f1" stroke-width="0.5" opacity="0.2"/>
    <!-- Connections L2-L3 -->
    <line x1="700" y1="150" x2="1100" y2="200" stroke="#8b5cf6" stroke-width="0.5" opacity="0.3"/>
    <line x1="700" y1="300" x2="1100" y2="200" stroke="#8b5cf6" stroke-width="0.5" opacity="0.2"/>
    <line x1="700" y1="300" x2="1100" y2="400" stroke="#8b5cf6" stroke-width="0.6" opacity="0.3"/>
    <line x1="700" y1="450" x2="1100" y2="400" stroke="#8b5cf6" stroke-width="0.6" opacity="0.3"/>
    <line x1="700" y1="450" x2="1100" y2="550" stroke="#8b5cf6" stroke-width="0.5" opacity="0.2"/>
    <line x1="700" y1="600" x2="1100" y2="550" stroke="#8b5cf6" stroke-width="0.5" opacity="0.3"/>
    <!-- Connections L3-L4 -->
    <line x1="1100" y1="200" x2="1500" y2="300" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>
    <line x1="1100" y1="400" x2="1500" y2="300" stroke="#06b6d4" stroke-width="0.6" opacity="0.3"/>
    <line x1="1100" y1="400" x2="1500" y2="450" stroke="#06b6d4" stroke-width="0.6" opacity="0.3"/>
    <line x1="1100" y1="550" x2="1500" y2="450" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- Horizontal data streams -->
  <path d="M0 300 Q480 250 960 300 T1920 280" fill="none" stroke="url(#aline)" stroke-width="1" opacity="0.3"/>
  <path d="M0 500 Q480 550 960 500 T1920 520" fill="none" stroke="url(#aline)" stroke-width="0.8" opacity="0.2"/>
</svg>