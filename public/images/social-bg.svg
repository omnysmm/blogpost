<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <defs>
    <radialGradient id="sg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
    <filter id="sglow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="sline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sdots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.6" fill="rgba(99,102,241,0.06)"/>
    </pattern>
  </defs>
  <rect width="1920" height="600" fill="url(#sdots)"/>
  <ellipse cx="960" cy="300" rx="600" ry="300" fill="url(#sg1)"/>
  <!-- Connection hub in center -->
  <g filter="url(#sglow)" opacity="0.5">
    <circle cx="960" cy="300" r="8" fill="#6366f1"/>
    <circle cx="960" cy="300" r="20" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.4"/>
    <circle cx="960" cy="300" r="35" fill="none" stroke="#8b5cf6" stroke-width="0.3" opacity="0.2"/>
    <!-- Satellite nodes -->
    <circle cx="400" cy="200" r="5" fill="#4680C2" opacity="0.6"/>
    <circle cx="650" cy="120" r="5" fill="#26A5E4" opacity="0.6"/>
    <circle cx="960" cy="100" r="5" fill="#FF0000" opacity="0.6"/>
    <circle cx="1270" cy="120" r="5" fill="#E1306C" opacity="0.6"/>
    <circle cx="1520" cy="200" r="5" fill="#010101" opacity="0.6"/>
    <circle cx="400" cy="400" r="4" fill="#EE8208" opacity="0.5"/>
    <circle cx="650" cy="480" r="4" fill="#10B981" opacity="0.5"/>
    <circle cx="1270" cy="480" r="4" fill="#F59E0B" opacity="0.5"/>
    <circle cx="1520" cy="400" r="4" fill="#EF4444" opacity="0.5"/>
    <!-- Lines to center -->
    <line x1="400" y1="200" x2="960" y2="300" stroke="#4680C2" stroke-width="0.8" opacity="0.2"/>
    <line x1="650" y1="120" x2="960" y2="300" stroke="#26A5E4" stroke-width="0.8" opacity="0.2"/>
    <line x1="960" y1="100" x2="960" y2="300" stroke="#FF0000" stroke-width="0.8" opacity="0.2"/>
    <line x1="1270" y1="120" x2="960" y2="300" stroke="#E1306C" stroke-width="0.8" opacity="0.2"/>
    <line x1="1520" y1="200" x2="960" y2="300" stroke="#010101" stroke-width="0.8" opacity="0.2"/>
    <line x1="400" y1="400" x2="960" y2="300" stroke="#EE8208" stroke-width="0.6" opacity="0.15"/>
    <line x1="650" y1="480" x2="960" y2="300" stroke="#10B981" stroke-width="0.6" opacity="0.15"/>
    <line x1="1270" y1="480" x2="960" y2="300" stroke="#F59E0B" stroke-width="0.6" opacity="0.15"/>
    <line x1="1520" y1="400" x2="960" y2="300" stroke="#EF4444" stroke-width="0.6" opacity="0.15"/>
  </g>
  <!-- Data flow lines -->
  <path d="M0 300 Q240 280 480 300 T960 290 T1440 310 T1920 300" fill="none" stroke="url(#sline)" stroke-width="1"/>
</svg>