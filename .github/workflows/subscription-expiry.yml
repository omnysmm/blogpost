name: Subscription Expiry Sweep

on:
  schedule:
    # daily at 03:27 UTC
    - cron: '27 3 * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call subscription-expiry edge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL missing — skip (configure secrets to enable the sweep)."
            exit 0
          fi
          curl -sS -X POST "$SUPABASE_URL/functions/v1/subscription-expiry" \
            -H "Authorization: Bearer ${CRON_SECRET:-$SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 60
